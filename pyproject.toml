[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptovalid-opencore"
version = "0.9.2"
description = "Verifiable compliance evidence: hash-chained ledgers + standalone offline verifier (flat-layout modules, unchanged declared commands)"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.9"
authors = [{name = "Roberto Locatelli"}]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/robertolocatelli81-dev/cryptovalid-opencore"

[project.scripts]
cryptovalid-verify = "verify_evidence:main"

[tool.setuptools]
py-modules = ['ap2_evidence', 'cldma_confidential', 'committed_attestation', 'conformance', 'cryptovalid_heterogeneous', 'cryptovalid_ingest', 'cryptovalid_kms', 'cryptovalid_lotl', 'cryptovalid_mcp', 'cryptovalid_merkle', 'cryptovalid_pruning_probe', 'cryptovalid_qeas', 'cryptovalid_reanchor', 'cryptovalid_report', 'cryptovalid_solana', 'cryptovalid_tsa', 'cryptovalid_worm', 'dora_incident', 'evidence_pack', 'fundcert_canonical', 'fundcert_crosssource', 'microfinance', 'mutation_runner', 'pedersen_commit', 'refresh_regulatory', 'signer', 'tx_evidence', 'verifier', 'verify_evidence']
