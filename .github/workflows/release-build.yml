# Wheel and sdist of a release, built on a GitHub-hosted runner from the tag, with signed SLSA build provenance
# (actions/attest: Sigstore, SLSA v1 Build Level 2). The release assets and PyPI then carry these bytes:
#   gh run download <run> -n dist   ->   the KMS-signed evidence pack is made from them (--from-existing)
# Verify a file:  gh attestation verify <file> --repo <owner>/<repo> --signer-workflow <owner>/<repo>/.github/workflows/release-build.yml --source-ref refs/tags/v<version>
name: release-build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # a trial build from a branch: same steps, the version is not compared with a tag
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # Sigstore signing certificate for the attestation
      attestations: write   # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build front-end and backend pinned by hash
        run: python -m pip install --require-hashes --no-deps -r .github/build-requirements.txt
      - name: Build wheel and sdist (no isolation, so the pinned setuptools is the one used)
        shell: bash
        run: |
          set -euo pipefail
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::pyproject.toml is $v, tag is $GITHUB_REF_NAME"; exit 1; }
          fi
          python -m build --no-isolation --outdir dist .
          ls dist
          [ "$(ls dist | wc -l)" = 2 ] || { echo "::error::expected one wheel and one sdist"; exit 1; }
          (cd dist && sha256sum *) | tee dist-sha256.txt
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Keep the attestation bundle with the files
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/build-provenance.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
