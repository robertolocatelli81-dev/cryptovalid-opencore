# SPDX-License-Identifier: AGPL-3.0-or-later
name: fuzz-weekly

# A fuzz run every week on a NEW seed (the run number), printed and kept, so a finding is reproduced with
# `python3 tools/fuzz_readers.py --seed <that number>`. 20 minutes per cell: Python 3.9, 3.11, 3.13, with and without
# cryptography and slh-dsa. A violation fails the job; the inputs that broke a rule are uploaded either way. Each run
# first shows that the fuzzer sees a disabled check (--ablate), or the job fails. Ported from omega-evidence
# (.github/workflows/fuzz-weekly.yml, Apache-2.0, same author). Rules: SPEC §26.

on:
  schedule:
    - cron: "41 3 * * 1"   # Mondays 03:41 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "time budget per matrix cell (seconds)"
        default: "1200"
      seed:
        description: "seed (empty = the run number)"
        default: ""

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}   # 3.9 has no build for ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
        libraries: ["yes", "no"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Libraries
        if: matrix.libraries == 'yes'
        run: python -m pip install cryptography 'slh-dsa>=0.2.5'
      - name: "Positive control: each target with its check disabled must show violations"
        shell: bash
        env:
          SEED_IN: ${{ github.event.inputs.seed }}
          RUN: ${{ github.run_number }}
          LIBS: ${{ matrix.libraries }}
        run: |
          SEED="${SEED_IN:-$RUN}"
          case "$SEED" in ''|*[!0-9]*) echo "::error::seed '$SEED' is not a number"; exit 1;; esac
          targets="ledger"
          if [ "$LIBS" = yes ]; then targets="ledger dsse slhdsa"; fi
          for t in $targets; do
            python tools/fuzz_readers.py --seed "$SEED" --iterations 3000 --ablate "$t" --findings-dir "$RUNNER_TEMP/ablation-$t" > "$RUNNER_TEMP/ablation-$t.json"
            cat "$RUNNER_TEMP/ablation-$t.json"
          done
      - name: "Fuzz for the time budget on this run's seed"
        shell: bash
        env:
          SEED_IN: ${{ github.event.inputs.seed }}
          SECS_IN: ${{ github.event.inputs.seconds }}
          RUN: ${{ github.run_number }}
          CELL: ${{ matrix.python-version }}-${{ matrix.libraries }}
        run: |
          SEED="${SEED_IN:-$RUN}"; SECS="${SECS_IN:-1200}"
          case "$SECS" in ''|*[!0-9]*) echo "::error::seconds '$SECS' is not a number"; exit 1;; esac
          case "$SEED" in ''|*[!0-9]*) echo "::error::seed '$SEED' is not a number"; exit 1;; esac
          echo "seed=$SEED seconds=$SECS cell=$CELL"
          python tools/fuzz_readers.py --seed "$SEED" --iterations 0 --seconds "$SECS" \
            --findings-dir "fuzz-findings-$CELL" --json "fuzz-$CELL.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-${{ matrix.python-version }}-libraries-${{ matrix.libraries }}
          path: |
            fuzz-*.json
            fuzz-findings-*
          if-no-files-found: ignore
