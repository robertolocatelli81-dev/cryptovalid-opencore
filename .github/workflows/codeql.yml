# SPDX-License-Identifier: AGPL-3.0-or-later
# CodeQL static analysis (SAST) of the Python code: on every push and pull request to master, and every week, so new
# queries run on unchanged code too. Findings go to code scanning. Rules: SPEC §26.
name: codeql

on:
  push:
  pull_request:
  schedule:
    - cron: "29 4 * * 1"   # Mondays 04:29 UTC

permissions:
  contents: read

# a push to a trial branch ends the run of the commit it replaces; every other ref runs to the end
concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/ci-prova-') && format('{0} {1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci-prova-') }}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write   # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:python"
