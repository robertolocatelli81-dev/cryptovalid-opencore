# CryptoValid Open Core — CI that DEMONSTRATES the gate.
# Green on an intact ledger; RED on a tampered one. Signed evidence + auditor pack, end-to-end,
# with nothing but this repository (no vendor, no account). SPDX-License-Identifier: AGPL-3.0-or-later
name: verify-evidence

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # weekly: the newest ap2-evidence-pack 1.x from the index against every suite, untouched or not

# Read-only token for every job (OpenSSF Scorecard Token-Permissions; no job writes to the repository)
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}   # 3.9 has no build for ubuntu-26.04 (ubuntu-latest from 2026-10-19)
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]   # every Python from the declared floor (>=3.9) to the newest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional deps (hash verifier itself is stdlib-only) + a REAL PKCS#11 HSM bench
        run: |
          pip install cryptography 'ap2-evidence-pack>=1.6.0,<2' 'slh-dsa>=0.2.5' --extra-index-url https://robertolocatelli81-dev.github.io/pypi/
          sudo apt-get update -qq && sudo apt-get install -y -qq softhsm2 opensc

      - name: Unit tests — every suite in the repo (signer, evidence pack, merkle, TSA, LOTL, KMS/HSM)
        run: |
          for t in test_*.py; do
            echo "== $t"
            CV_REQUIRE_CRYPTO=1 CV_REQUIRE_SLHDSA=1 python3 "$t"
          done

      - name: "AP2 front-end without the package: a refusal that names it, exit 1, never a traceback"
        run: |
          python3 -m venv "$RUNNER_TEMP/noap2" && "$RUNNER_TEMP/noap2/bin/pip" install -q cryptography
          echo '{}' > "$RUNNER_TEMP/x.json"
          set +e; "$RUNNER_TEMP/noap2/bin/python" verify_evidence.py ap2 "$RUNNER_TEMP/x.json" > "$RUNNER_TEMP/noap2.txt" 2>&1; rc=$?; set -e
          cat "$RUNNER_TEMP/noap2.txt"
          test "$rc" = 1
          ! grep -q Traceback "$RUNNER_TEMP/noap2.txt"
          grep -q "ap2-evidence-pack not installed" "$RUNNER_TEMP/noap2.txt"

      - name: Conformance — the reference verifier MUST match every test vector
        run: python3 conformance.py

      - name: "Without cryptography (this Python) — every suite green in a clean venv, the cases that need it skipped with the reason"
        run: |
          python3 -m venv --without-pip "$RUNNER_TEMP/nocrypto"
          if "$RUNNER_TEMP/nocrypto/bin/python" -c "import cryptography" 2>/dev/null; then echo "::error::venv has cryptography"; exit 1; fi
          ran=0; skipped=0
          for t in test_*.py; do
            if ! "$RUNNER_TEMP/nocrypto/bin/python" "$t" > "$RUNNER_TEMP/nc_one.txt" 2>&1; then
              cat "$RUNNER_TEMP/nc_one.txt"; echo "::error::$t is red without cryptography (it must skip what needs it)"; exit 1
            fi
            r=$(grep -oE '^Ran [0-9]+' "$RUNNER_TEMP/nc_one.txt" | tail -1 | grep -oE '[0-9]+' || echo 0)
            s=$(grep -oE 'skipped=[0-9]+' "$RUNNER_TEMP/nc_one.txt" | tail -1 | grep -oE '[0-9]+' || echo 0)
            ran=$((ran + r)); skipped=$((skipped + s))
          done
          echo "without cryptography: $ran tests, $skipped skipped, $((ran - skipped)) executed"
          test $((ran - skipped)) -gt 0
          "$RUNNER_TEMP/nocrypto/bin/python" test_cryptovalid_witness.py 2>&1 | tee "$RUNNER_TEMP/nocrypto.txt"
          python3 -c "import re,sys; t=open('$RUNNER_TEMP/nocrypto.txt').read(); ran=re.search(r'^Ran (\d+) tests', t, re.M); sk=re.search(r'skipped=(\d+)', t); ok=re.search(r'^OK', t, re.M); sys.exit(0 if ran and ok and int(ran.group(1)) > int(sk.group(1) if sk else 0) else 1)" || { echo "::error::no test actually ran without cryptography"; exit 1; }

      - name: Solana anchor — the verifier MUST reject a fake cluster / wrong hash (offline gate)
        run: |
          # deterministic negative: a non-mainnet genesis must be rejected, no network needed
          python3 - <<'PY'
          import sys; sys.path.insert(0, ".")
          import cryptovalid_solana as CS
          CS._fetch_one = lambda rpc, sig, t: {"rpc": rpc, "reachable": True,
              "genesis": "FAKECLUSTER", "tx": {"meta": {"err": None},
              "transaction": {"message": {"accountKeys": [{"pubkey": "x"}],
              "instructions": [{"program": "spl-memo", "parsed": "sha3:" + "a"*64}]}}}}
          out = CS.verify_solana_anchor("sig", "a"*64, rpcs=("fake",))
          assert out["ok"] is False, "fake cluster passed — genesis pin is broken"
          print("fake cluster correctly rejected — Solana genesis pin works")
          PY

      - name: Regulatory profiles — flag stale mappings (self-updating discipline)
        run: python3 refresh_regulatory.py --check-urls || echo "::warning::some regulatory mappings need human review"

      - name: Gate — an INTACT ledger passes (exit 0)
        run: python3 verifier.py examples/sample_ledger.jsonl

      - name: Gate — a TAMPERED ledger MUST fail the build
        run: |
          if python3 verifier.py examples/sample_ledger_tampered.jsonl; then
            echo "::error::tampered ledger passed verification — the gate is broken"
            exit 1
          fi
          echo "tampered ledger correctly rejected (verifier exited non-zero) — gate works"

      - name: End-to-end — sign, verify, pack, verify pack (vendor-free)
        run: |
          python3 signer.py keygen "$RUNNER_TEMP/ci.key"
          python3 signer.py sign examples/sample_ledger.jsonl "$RUNNER_TEMP/signed.jsonl" "$RUNNER_TEMP/ci.key"
          python3 verifier.py "$RUNNER_TEMP/signed.jsonl"                 # hash chain PASS
          python3 signer.py verify "$RUNNER_TEMP/signed.jsonl"           # signatures PASS
          python3 evidence_pack.py build "$RUNNER_TEMP/pack" "$RUNNER_TEMP/signed.jsonl" --subject "CI demo"
          python3 evidence_pack.py verify "$RUNNER_TEMP/pack"            # bundle PASS (valid: true)

      - name: End-to-end — sign via a REAL HSM (SoftHSM2, non-exportable key) and verify offline
        run: |
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm2.conf" CRYPTOVALID_PIN=123456
          mkdir -p "$RUNNER_TEMP/tokens"
          echo "directories.tokendir = $RUNNER_TEMP/tokens" > "$SOFTHSM2_CONF"
          softhsm2-util --init-token --free --label ci --pin 123456 --so-pin 654321
          M=$(ls /usr/lib/softhsm/libsofthsm2.so /usr/lib/*/softhsm/libsofthsm2.so 2>/dev/null | head -1)
          test -n "$M"   # il modulo PKCS#11 DEVE esserci: fail visibile, non skip
          B="pkcs11:module=$M;token=ci;key=evidence;pin=env:CRYPTOVALID_PIN"
          python3 cryptovalid_kms.py keygen-hsm --backend "$B"
          python3 signer.py sign examples/sample_ledger.jsonl "$RUNNER_TEMP/hsm_signed.jsonl" --backend "$B"
          python3 verifier.py "$RUNNER_TEMP/hsm_signed.jsonl"            # hash chain PASS (stdlib-only)
          python3 signer.py verify "$RUNNER_TEMP/hsm_signed.jsonl"       # HSM signatures PASS

  # Independent verifiers of the same spec. The differential oracle runs Python, JS, Go, Rust and Java on hostile inputs
  # (Swift has its own macOS job) and fails the build on any disagreement except the divergences it declares by name and
  # exact pattern (DECLARED_DIVERGENCE: layers a verifier does not check — e.g. a broken entry signature without a pinned
  # key is PASS for Python and Rust, which count signatures as not checked, and FAIL for JS, Go and Java; a tampered
  # ML-DSA-65 tip is FAIL for Python, Go and Java and PASS for JS). So the same verdict everywhere holds for every input
  # outside those declared cases, and only because this job exists
  # (added 2026-09-11 with Python/JS/Rust; Go, Java and the note oracle joined in later releases).
  other-os:
    # the same suites on macOS and Windows: every test_*.py with cryptography, then in a clean venv without it
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install cryptography 'ap2-evidence-pack>=1.6.0,<2' 'slh-dsa>=0.2.5' --extra-index-url https://robertolocatelli81-dev.github.io/pypi/
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"   # the Go verifier the cross-language suites build, as in independent-verifiers
      - name: SoftHSM2 and OpenSC (macOS, Homebrew; the current formula, the version printed)
        if: runner.os == 'macOS'
        run: |
          brew install softhsm opensc
          brew list --versions softhsm opensc
          echo "CV_REQUIRE_SOFTHSM=1" >> "$GITHUB_ENV"
      - name: Cache of SoftHSM2 built for Windows (key = SoftHSMv2 commit, runner image, build options)
        if: runner.os == 'Windows'
        id: softhsm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/softhsm
          key: softhsm2-13e6e86b83748fef74046dbf0c91f664b7acc1c3-windows-2025-x64-openssl-eddsa-v2
      - name: SoftHSM2 2.7.0 from source (Windows, commit 13e6e86b, vcpkg OpenSSL; the project ships no Windows binary)
        if: runner.os == 'Windows' && steps.softhsm-cache.outputs.cache-hit != 'true'
        run: |
          src="$RUNNER_TEMP/softhsm-src"; out="$RUNNER_TEMP/softhsm"; vcpkg="$VCPKG_INSTALLATION_ROOT"
          git init -q "$src" && git -C "$src" fetch -q --depth 1 https://github.com/softhsm/SoftHSMv2 13e6e86b83748fef74046dbf0c91f664b7acc1c3
          git -C "$src" checkout -q FETCH_HEAD
          "$vcpkg/vcpkg" install openssl:x64-windows
          cmake -S "$src" -B "$src/build" -A x64 -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DWITH_CRYPTO_BACKEND=openssl -DENABLE_EDDSA=ON -DDISABLE_NON_PAGED_MEMORY=ON -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$out"
          cmake --build "$src/build" --config Release
          cmake --install "$src/build" --config Release
          m=$(find "$out" -iname 'softhsm2*.dll' | head -1)
          cp "$vcpkg"/installed/x64-windows/bin/*.dll "$(dirname "$m")/"   # a DLL's dependencies are found in its folder
      - name: SoftHSM2 module and OpenSC 0.27.1 MSI (Windows, sha256 checked)
        if: runner.os == 'Windows'
        run: |
          m=$(find "$RUNNER_TEMP/softhsm" -iname 'softhsm2*.dll' | head -1)
          [ -n "$m" ] || { echo "softhsm2 DLL not found"; exit 1; }
          echo "CV_SOFTHSM_MODULE=$(cygpath -w "$m")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$(dirname "$m")")" >> "$GITHUB_PATH"
          u=$(find "$RUNNER_TEMP/softhsm" -iname 'softhsm2-util.exe' | head -1)   # run 45377477990: not on PATH
          [ -n "$u" ] || { echo "softhsm2-util.exe not found"; exit 1; }
          echo "$(cygpath -w "$(dirname "$u")")" >> "$GITHUB_PATH"
          f="$RUNNER_TEMP/OpenSC-0.27.1_x64.msi"
          curl -sSfL -o "$f" https://github.com/OpenSC/OpenSC/releases/download/0.27.1/OpenSC-0.27.1_x64.msi
          echo "88ea45e848063ff5f3594a457b7f023223472eae9c9c543f8035f7689bb7b319  $f" | sha256sum -c -
          powershell -NoProfile -Command "\$p = Start-Process msiexec -ArgumentList '/i','$(cygpath -w "$f")','/qn','/norestart' -Wait -PassThru; exit \$p.ExitCode"
          echo 'C:\Program Files\OpenSC Project\OpenSC\tools' >> "$GITHUB_PATH"
          echo "CV_REQUIRE_SOFTHSM=1" >> "$GITHUB_ENV"
      - name: OpenSSL 3 first on PATH (macOS ships LibreSSL as /usr/bin/openssl, without the `ts` checks the code uses)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: A full volume, the equivalent of Linux's /dev/full (writes there fail with ENOSPC)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 4m -fs HFS+ -volname cvfull "$RUNNER_TEMP/full.dmg"
          hdiutil attach "$RUNNER_TEMP/full.dmg"
          : > /Volumes/cvfull/sink
          dd if=/dev/zero of=/Volumes/cvfull/fill bs=4096 || true
          dd if=/dev/zero of=/Volumes/cvfull/fill2 bs=1 || true   # to the last byte
          if printf x > /Volumes/cvfull/probe; then echo "the volume is not full"; exit 1; fi
          echo "CV_FULL_DIR=/Volumes/cvfull" >> "$GITHUB_ENV"
      - name: A full volume, the equivalent of Linux's /dev/full (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = Join-Path $env:RUNNER_TEMP "full.vhdx"
          $s = Join-Path $env:RUNNER_TEMP "full.txt"
          Set-Content $s "create vdisk file=`"$v`" maximum=16 type=fixed`r`nselect vdisk file=`"$v`"`r`nattach vdisk`r`ncreate partition primary`r`nformat fs=fat quick label=CVFULL`r`nassign letter=Q"
          diskpart /s $s
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path Q:\)) { throw "the full volume was not made (diskpart exit $LASTEXITCODE)" }
          New-Item -ItemType File Q:\sink | Out-Null
          # filled to the last byte: blocks of 64 KiB, then smaller down to 1 byte (run 45377477990: the 64 KiB loop left
          # room under 64 KiB, a receipt fitted, and every "disk full" case answered 0)
          $f = [IO.File]::OpenWrite("Q:\fill")
          foreach ($n in 65536, 4096, 512, 1) { $b = New-Object byte[] $n; try { while ($true) { $f.Write($b, 0, $n); $f.Flush() } } catch { } }
          $f.Dispose()
          $full = $false
          try { [IO.File]::WriteAllBytes("Q:\probe", [byte[]](1)) } catch [IO.IOException] { $full = $true }
          if (-not $full) { throw "the volume is not full: a 1-byte file was written" }
          "CV_FULL_DIR=Q:\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: The tools the suites call (a missing one is named; its cases skip with the reason)
        run: |
          for t in openssl node java go pkcs11-tool softhsm2-util; do printf '%s: ' "$t"; command -v "$t" || echo "not on PATH"; done
          openssl version; echo "CV_FULL_DIR=$CV_FULL_DIR"; ls -la "$CV_FULL_DIR"
      - name: Every suite with cryptography
        if: always()
        run: |
          fail=0
          for t in test_*.py; do echo "== $t"; CV_REQUIRE_CRYPTO=1 CV_REQUIRE_SLHDSA=1 python "$t" || { echo "::error::$t"; fail=1; }; done
          exit $fail
      - name: Conformance
        if: always()
        run: python conformance.py
      - name: Every suite without cryptography
        if: always()
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/nocrypto"
          py="$RUNNER_TEMP/nocrypto/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/nocrypto/Scripts/python.exe"
          if "$py" -c "import cryptography" 2>/dev/null; then echo "::error::venv has cryptography"; exit 1; fi
          fail=0
          for t in test_*.py; do echo "== $t"; "$py" "$t" || { echo "::error::$t is red without cryptography"; fail=1; }; done
          exit $fail

  floor:
    # the declared minimums, installed exactly: cryptography 48.0.0 (the sign extra) and ap2-evidence-pack 1.6.0 (the ap2
    # extra) -- each run proves the minimum exists on the index and works; test_dependency_versions.py keeps these in step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: pip install "cryptography==48.0.0" 'ap2-evidence-pack==1.6.0' --extra-index-url https://robertolocatelli81-dev.github.io/pypi/
      - name: Every suite with the declared floor
        run: |
          set -e
          python3 -c "import cryptography; assert cryptography.__version__ == '48.0.0', cryptography.__version__"
          for t in test_*.py; do echo "== $t"; CV_REQUIRE_CRYPTO=1 python3 "$t"; done

  independent-verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Python 'cryptography' — so the signed-tip cases are MEASURED by the oracle, not skipped
        run: pip install cryptography
      - name: JS verifier — self-test against the spec vectors and the Python reference
        run: node verifiers/js/test.mjs
      - name: Rust verifier — unit tests + rejects the tampered ledger
        run: |
          cargo test --release --manifest-path verifiers/rust/Cargo.toml
          if cargo run -q --release --manifest-path verifiers/rust/Cargo.toml -- examples/sample_ledger_tampered.jsonl; then
            echo "::error::rust verifier accepted a tampered ledger"; exit 1; fi
          cargo run -q --release --manifest-path verifiers/rust/Cargo.toml -- examples/sample_ledger.jsonl > /dev/null
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"   # crypto/mldsa (ML-DSA-65 hybrid tip) is stdlib since Go 1.27; older toolchains build the compat file (pq_unverifiable)
      - name: Go verifier + writer — race tests, shared vectors, rejects the tampered ledger
        run: |
          (cd verifiers/go && go test -race ./...)
          go build -C verifiers/go -o "$RUNNER_TEMP/cvverify-go" ./cmd/cvverify
          if "$RUNNER_TEMP/cvverify-go" examples/sample_ledger_tampered.jsonl > /dev/null; then
            echo "::error::go verifier accepted a tampered ledger"; exit 1; fi
          "$RUNNER_TEMP/cvverify-go" examples/sample_ledger.jsonl > /dev/null
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: "oracle"   # JDK 27 GA (15/09/2026): ML-DSA-65 (JDK 24+) with the profile's EMPTY context; Ed25519 since 15
          java-version: "27"
      - name: "Java verifier — JDK standard library only; intact ledger passes, tampered ledger rejected"
        run: |
          javac -d "$RUNNER_TEMP/cvj" verifiers/java/CvVerify.java
          if java -cp "$RUNNER_TEMP/cvj" CvVerify examples/sample_ledger_tampered.jsonl > /dev/null; then
            echo "::error::java verifier accepted a tampered ledger"; exit 1; fi
          java -cp "$RUNNER_TEMP/cvj" CvVerify examples/sample_ledger.jsonl > /dev/null
      - name: "Receipt not written = exit 74 (0.20.3): the Python CLIs and the Java verifier on /dev/full, a gone reader, a closed stdout"
        run: CV_REQUIRE_CRYPTO=1 CV_REQUIRE_JAVA=1 python3 test_receipt_not_written.py
      - name: "Outcome whole or exit 74 (13/10): -u, a late non-blocking reader (Python, Java), usage with stderr lost, promised files, ledger lines, openssl that cannot run"
        run: CV_REQUIRE_CRYPTO=1 CV_REQUIRE_JAVA=1 CV_REQUIRE_OPENSSL=1 python3 test_receipt_design_20261013.py
      - name: Differential oracle — Python vs JS vs Go vs Rust vs Java must agree on every hostile input
        run: python3 verifiers/differential_oracle.py
      - name: "SCITT statements — pycose (independent COSE implementation) as the oracle, required here"
        run: |
          pip install "pycose==1.1.0" "cbor2==5.4.*"
          CV_REQUIRE_PYCOSE=1 python3 test_cryptovalid_scitt.py

      - name: "Acta signed receipts — the official Cedar bindings drive the vectors; the reference receipts (protect-mcp 0.29.0) are the positive control"
        run: |
          pip install cedarpy
          CV_REQUIRE_CRYPTO=1 CV_REQUIRE_CEDAR=1 python3 test_cryptovalid_acta.py
      - name: "Checkpoint notes and witness cosignatures — opened by the ecosystem's own Go libraries (note oracle, required here)"
        run: |
          go build -C verifiers/note_oracle -o "$RUNNER_TEMP/cvnote-oracle" .
          CV_REQUIRE_GO_ORACLE=1 python3 test_cryptovalid_witness.py
          CV_REQUIRE_GO_ORACLE=1 python3 test_c2sp_static_ct_20261115.py
      - name: "C2SP tiles — read by golang.org/x/mod/sumdb/tlog, filippo.io/sunlight and filippo.io/torchwood (tile oracle, required here)"
        run: CV_REQUIRE_GO_ORACLE=1 python3 test_c2sp_tiles_20261115.py

  swift-verifier:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Swift verifier — unit tests + rejects the tampered ledger
        working-directory: verifiers/swift
        run: |
          swift --version
          swift test
          if swift run -c release cvverify ../../examples/sample_ledger_tampered.jsonl; then
            echo "::error::swift verifier accepted a tampered ledger"; exit 1; fi
          swift run -c release cvverify ../../examples/sample_ledger.jsonl > /dev/null
          # a FIFO is read (0.20.2); the binary itself, since `swift run` does not pass the process-substitution descriptor on
          "$(swift build -c release --show-bin-path)/cvverify" <(cat ../../examples/sample_ledger.jsonl) > /dev/null
