# CryptoValid Open Core — CI that DEMONSTRATES the gate.
# Green on an intact ledger; RED on a tampered one. Signed evidence + auditor pack, end-to-end,
# with nothing but this repository (no vendor, no account). SPDX-License-Identifier: AGPL-3.0-or-later
name: verify-evidence

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional deps (hash verifier itself is stdlib-only) + a REAL PKCS#11 HSM bench
        run: |
          pip install cryptography
          sudo apt-get update -qq && sudo apt-get install -y -qq softhsm2 opensc

      - name: Unit tests — every suite in the repo (signer, evidence pack, merkle, TSA, LOTL, KMS/HSM)
        run: |
          for t in test_*.py; do
            echo "== $t"
            python3 "$t"
          done

      - name: Conformance — the reference verifier MUST match every test vector
        run: python3 conformance.py

      - name: Solana anchor — the verifier MUST reject a fake cluster / wrong hash (offline gate)
        run: |
          # deterministic negative: a non-mainnet genesis must be rejected, no network needed
          python3 - <<'PY'
          import sys; sys.path.insert(0, ".")
          import cryptovalid_solana as CS
          CS._fetch_one = lambda rpc, sig, t: {"rpc": rpc, "reachable": True,
              "genesis": "FAKECLUSTER", "tx": {"meta": {"err": None},
              "transaction": {"message": {"accountKeys": [{"pubkey": "x"}],
              "instructions": [{"program": "spl-memo", "parsed": "sha3:" + "a"*64}]}}}}
          out = CS.verify_solana_anchor("sig", "a"*64, rpcs=("fake",))
          assert out["ok"] is False, "fake cluster passed — genesis pin is broken"
          print("fake cluster correctly rejected — Solana genesis pin works")
          PY

      - name: Regulatory profiles — flag stale mappings (self-updating discipline)
        run: python3 refresh_regulatory.py --check-urls || echo "::warning::some regulatory mappings need human review"

      - name: Gate — an INTACT ledger passes (exit 0)
        run: python3 verifier.py examples/sample_ledger.jsonl

      - name: Gate — a TAMPERED ledger MUST fail the build
        run: |
          if python3 verifier.py examples/sample_ledger_tampered.jsonl; then
            echo "::error::tampered ledger passed verification — the gate is broken"
            exit 1
          fi
          echo "tampered ledger correctly rejected (verifier exited non-zero) — gate works"

      - name: End-to-end — sign, verify, pack, verify pack (vendor-free)
        run: |
          python3 signer.py keygen "$RUNNER_TEMP/ci.key"
          python3 signer.py sign examples/sample_ledger.jsonl "$RUNNER_TEMP/signed.jsonl" "$RUNNER_TEMP/ci.key"
          python3 verifier.py "$RUNNER_TEMP/signed.jsonl"                 # hash chain PASS
          python3 signer.py verify "$RUNNER_TEMP/signed.jsonl"           # signatures PASS
          python3 evidence_pack.py build "$RUNNER_TEMP/pack" "$RUNNER_TEMP/signed.jsonl" --subject "CI demo"
          python3 evidence_pack.py verify "$RUNNER_TEMP/pack"            # bundle PASS (valid: true)

      - name: End-to-end — sign via a REAL HSM (SoftHSM2, non-exportable key) and verify offline
        run: |
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm2.conf" CRYPTOVALID_PIN=123456
          mkdir -p "$RUNNER_TEMP/tokens"
          echo "directories.tokendir = $RUNNER_TEMP/tokens" > "$SOFTHSM2_CONF"
          softhsm2-util --init-token --free --label ci --pin 123456 --so-pin 654321
          M=$(ls /usr/lib/softhsm/libsofthsm2.so /usr/lib/*/softhsm/libsofthsm2.so 2>/dev/null | head -1)
          test -n "$M"   # il modulo PKCS#11 DEVE esserci: fail visibile, non skip
          B="pkcs11:module=$M;token=ci;key=evidence;pin=env:CRYPTOVALID_PIN"
          python3 cryptovalid_kms.py keygen-hsm --backend "$B"
          python3 signer.py sign examples/sample_ledger.jsonl "$RUNNER_TEMP/hsm_signed.jsonl" --backend "$B"
          python3 verifier.py "$RUNNER_TEMP/hsm_signed.jsonl"            # hash chain PASS (stdlib-only)
          python3 signer.py verify "$RUNNER_TEMP/hsm_signed.jsonl"       # HSM signatures PASS
